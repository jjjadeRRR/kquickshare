name: Build and protocol tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install build and test dependencies
        run: >-
          pacman -Syu --noconfirm --needed git cmake ninja
          qt6-base qt6-svg qt6-declarative qt6-tools openssl
          knotifications kstatusnotifieritem prison ki18n
          plasma-workspace dbus python-cryptography
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Test core, GUI and clipboard integration
        run: ctest --test-dir build --output-on-failure
      - name: Test independent encrypted sender and receiver
        run: |
          python tests/fake_sender.py --binary build/kquickshare-cli -v
          python tests/fake_receiver.py --binary build/kquickshare-send -v
      - name: Verify the one-command installer
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/kquickshare-install" --no-start --no-deps
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/kquickshare-install/bin/kquickshare" --version
